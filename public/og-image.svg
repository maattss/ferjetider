<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Ferjetider Bergen-Stavanger">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1220" />
      <stop offset="0.55" stop-color="#0d1a2c" />
      <stop offset="1" stop-color="#1a2f4a" />
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#081425" />
      <stop offset="1" stop-color="#030912" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)" />

  <!-- Mountain silhouettes, echoing the site hero -->
  <polygon
    points="0,430 120,382 210,404 330,368 450,398 580,376 700,404 830,380 950,400 1080,366 1200,392 1200,430"
    fill="#162a42" opacity="0.55" />
  <polygon
    points="0,430 90,404 190,414 280,396 400,412 520,402 640,414 760,406 890,414 1010,402 1200,410 1200,430"
    fill="#0a1b2e" opacity="0.8" />

  <rect x="0" y="430" width="1200" height="200" fill="url(#sea)" />

  <!-- Wave lines -->
  <g fill="none" stroke="#6b9bcc" stroke-width="1.6">
    <path d="M0 462 Q 100 456 200 462 T 400 462 T 600 462 T 800 462 T 1000 462 T 1200 462" opacity="0.16" />
    <path d="M0 496 Q 100 489 200 496 T 400 496 T 600 496 T 800 496 T 1000 496 T 1200 496" opacity="0.13" />
    <path d="M0 532 Q 100 524 200 532 T 400 532 T 600 532 T 800 532 T 1000 532 T 1200 532" opacity="0.1" />
  </g>

  <!-- Ferry -->
  <g transform="translate(830 372) scale(2.6)">
    <path d="M 0 8 L 4 16 L 84 16 L 90 8 Z" fill="#000000" />
    <rect x="8" y="0" width="70" height="8" fill="#c8d2dc" />
    <g fill="#ffd15c">
      <rect x="11" y="2" width="3.5" height="3" /><rect x="16.5" y="2" width="3.5" height="3" />
      <rect x="22" y="2" width="3.5" height="3" /><rect x="27.5" y="2" width="3.5" height="3" />
      <rect x="33" y="2" width="3.5" height="3" /><rect x="38.5" y="2" width="3.5" height="3" />
      <rect x="44" y="2" width="3.5" height="3" /><rect x="49.5" y="2" width="3.5" height="3" />
      <rect x="55" y="2" width="3.5" height="3" /><rect x="60.5" y="2" width="3.5" height="3" />
      <rect x="66" y="2" width="3.5" height="3" /><rect x="71.5" y="2" width="3.5" height="3" />
    </g>
    <rect x="20" y="-6" width="45" height="6" fill="#c8d2dc" />
    <rect x="55" y="-11" width="12" height="5" fill="#c8d2dc" />
    <rect x="40" y="-14" width="5" height="8" fill="#ffd15c" />
  </g>

  <g font-family="Space Grotesk, Inter, Helvetica Neue, Arial, sans-serif">
    <text x="88" y="196" font-size="30" font-weight="500" fill="#7f8da0" letter-spacing="7">
      FERJETIDER.FYI
    </text>
    <text x="88" y="288" font-size="76" font-weight="500" fill="#eaeef5" letter-spacing="-1.5">
      Ferjeavganger på E39
    </text>
    <text x="88" y="364" font-size="76" font-weight="500" fill="#eaeef5" letter-spacing="-1.5">
      Stavanger &#8211; Bergen
    </text>
    <text x="88" y="560" font-size="30" font-weight="400" fill="#aeb9c9">
      Mortavika ↔ Arsvågen &#183; Sandvikvåg ↔ Halhjem
    </text>
  </g>
</svg>
